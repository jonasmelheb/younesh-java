name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q package
      - uses: actions/upload-artifact@v4
        with:
          name: Younesh-jar
          path: target/Younesh.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/Younesh.jar "Younesh-${GITHUB_REF_NAME#v}.jar"
          gh release create "$GITHUB_REF_NAME" "Younesh-${GITHUB_REF_NAME#v}.jar" --title "Younesh (Java) $GITHUB_REF_NAME" --notes "Lancer avec : java -jar Younesh-${GITHUB_REF_NAME#v}.jar (Java 17 ou plus)."
