name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q package
      - uses: actions/upload-artifact@v4
        with:
          name: Younesh-jar
          path: target/Younesh.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/Younesh.jar "Younesh-$VERSION.jar"
          # La note reprend le message du commit taggé, sans les lignes Co-Authored-By et Claude-Session.
          {
            echo "## $(git log -1 --format=%s)"
            echo
            git log -1 --format=%b | sed -e '/^Co-Authored-By:/d' -e '/^Claude-Session:/d'
            echo
            echo "## Installer"
            echo
            echo "Télécharger \`Younesh-$VERSION.jar\`, puis lancer \`java -jar Younesh-$VERSION.jar\` (Java 17 ou plus). Si Younesh est déjà installé, il se met à jour tout seul à la fermeture."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "Younesh-$VERSION.jar" --title "Younesh (Java) $GITHUB_REF_NAME" --notes-file notes.md
